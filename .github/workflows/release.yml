# Changesets release flow. On every push to main:
# - while there are changesets, opens or updates a "Version Packages" PR that bumps versions
#   and writes the changelog;
# - once that PR is merged (no changesets left), publishes any package version that is not
#   on npm yet. The first run publishes 0.1.0 this way.
# The repo setting "Allow GitHub Actions to create and approve pull requests"
# (Settings > Actions > General) must be on.
name: Release

on:
  push:
    branches: ["main"]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the version commit and release tags
  pull-requests: write # open the Version Packages PR
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which trusted publishing needs (npm >= 11.5.1).
          node-version: 24
          cache: "npm"
          # Writes an .npmrc that reads the token from NODE_AUTH_TOKEN.
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - uses: changesets/action@v2
        with:
          pr-title: "Version Packages"
          commit-message: "mod: version packages"
          version-script: npm run version-packages
          # Builds and checks the package (publint, attw, packed files), then publishes.
          publish-script: npm run release
        env:
          # Publish credentials (#6). Default: an npm granular access token with publish
          # rights, stored as the NPM_TOKEN repo secret. The first publish needs it, because
          # npm trusted publishing can only be configured on a package that already exists.
          # Alternative: npm trusted publishing. On npmjs.com, add this repo and the
          # `release.yml` workflow as the package's trusted publisher, then delete the
          # NPM_TOKEN secret. npm then authenticates through OIDC (the id-token permission
          # above), which it prefers over a token, and adds provenance automatically.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
